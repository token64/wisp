# XAMPP: incluir en httpd.conf o httpd-vhosts.conf, por ejemplo:
#   Include "C:/xampp/htdocs/wisp/deploy/xampp/fiber-atlas-alias.conf"
# Luego abrir: http://localhost/fiber-atlas/

Alias /fiber-atlas "C:/xampp/htdocs/wisp/fiber-atlas/public"

<Directory "C:/xampp/htdocs/wisp/fiber-atlas/public">
  Options FollowSymLinks
  AllowOverride All
  Require all granted
</Directory>
