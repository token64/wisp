# Incluir desde httpd.conf (XAMPP Apache), al final:
#   Include conf/extra/mapwisp-alias.conf
#
# O copiar el contenido en httpd-vhosts.conf

Alias /mapwisp "C:/xampp/htdocs/wisp/mapwisp"

<Directory "C:/xampp/htdocs/wisp/mapwisp">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
