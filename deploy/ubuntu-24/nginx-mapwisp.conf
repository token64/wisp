# Sitio estático: cliente AngularJS bajo /mapwisp/
# Copiar a: /etc/nginx/sites-available/mapwisp
# Activar: ln -sfn /etc/nginx/sites-available/mapwisp /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name mapwisp.local _;

    # Raíz del repo: .../wisp  (donde existe wisp/mapwisp/...)
    root /var/www/wisp;
    charset utf-8;
    client_max_body_size 64M;

    location /mapwisp/ {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff;
    }

    location ~* ^/mapwisp/(\.git|\.env) {
        deny all;
        return 404;
    }

