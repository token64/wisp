<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fiber Atlas — fibra, mufas y terminales</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header>
          <h1>Fiber Atlas</h1>
          <p class="sub">
            Marca <strong>mufas</strong>, <strong>terminales</strong> y trazados de
            <strong>cable</strong> en el mapa. Datos en SQLite (local).
          </p>
        </header>
        <div class="tools">
          <button type="button" id="mode-none" class="active" data-mode="">
            Navegar
          </button>
          <button type="button" id="mode-mufa" data-mode="mufa">＋ Mufa</button>
          <button type="button" id="mode-terminal" data-mode="terminal">
            ＋ Terminal
          </button>
          <button type="button" id="mode-cable" data-mode="cable">＋ Cable</button>
          <button type="button" id="cable-finish" class="danger-outline" disabled>
            Finalizar cable
          </button>
          <button type="button" id="cable-cancel" disabled>Cancelar trazado</button>
        </div>
        <div class="list-wrap" id="lists"></div>
        <div class="status-bar" id="status">Listo.</div>
      </aside>
      <div id="map" role="application" aria-label="Mapa"></div>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true">
        <h3 id="modal-title">Editar</h3>
        <form id="modal-form">
          <input type="hidden" id="f-id" />
          <input type="hidden" id="f-type" />
          <label for="f-name">Nombre</label>
          <input type="text" id="f-name" autocomplete="off" />

          <div class="row2" id="f-latlng-row">
            <div>
              <label for="f-lat">Latitud</label>
              <input type="text" id="f-lat" inputmode="decimal" />
            </div>
            <div>
              <label for="f-lng">Longitud</label>
              <input type="text" id="f-lng" inputmode="decimal" />
            </div>
          </div>

          <div id="f-mufa-extra">
            <label for="f-model">Modelo / tipo</label>
            <input type="text" id="f-model" />
            <label for="f-splice">Empalmes (aprox.)</label>
            <input type="number" id="f-splice" min="0" step="1" />
          </div>

          <div id="f-terminal-extra">
            <label for="f-ports">Nº de puertos</label>
            <input type="number" id="f-ports" min="1" step="1" />
          </div>

          <div id="f-cable-extra">
            <div class="row2">
              <div>
                <label for="f-fibers">Fibras en el cable</label>
                <input type="number" id="f-fibers" min="1" step="1" />
              </div>
              <div>
                <label for="f-color">Color en mapa</label>
                <input type="color" id="f-color" />
              </div>
            </div>
          </div>

          <label for="f-notes">Notas</label>
          <textarea id="f-notes"></textarea>

          <div class="actions-row">
            <button type="button" class="btn-secondary" id="modal-cancel">
              Cerrar
            </button>
            <button type="submit" class="btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
